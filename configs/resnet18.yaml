# NV3 only: parameters are proposals to validate; never claim they are optimized.
model:
  name: resnet18
  num_classes: 4
  pretrained: true
  weights: IMAGENET1K_V1

data:
  class_mapping: configs/class_mapping.json
  train_split: data/splits/train.csv
  val_split: data/splits/val.csv
  test_split: data/splits/test.csv

preprocessing:
  image_size: 224
  resize_size: 256
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

augmentation:
  train:
    random_horizontal_flip: true
    color_jitter: 0.1

training:
  seed: 42
  batch_size: 32
  num_workers: 0
  loss: CrossEntropyLoss

stages:
  feature_extraction:
    freeze_backbone: true
    epochs: 8
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001
    lr_scheduler: null
  fine_tuning:
    unfreeze_layers: [layer4]
    epochs: 10
    optimizer: AdamW
    lr_backbone: 0.00001
    lr_head: 0.0001
    weight_decay: 0.0001
    lr_scheduler: null
    early_stopping_patience: 4

checkpoint:
  monitor: val_macro_f1
  mode: max
  path: checkpoints/resnet18_best.pt

output:
  results_dir: results/resnet18
  figures_dir: figures
