# Cấu hình CNN tự xây dựng (huấn luyện từ đầu)
# Phụ trách: NV2 - Nguyễn Văn Duy
# NV2: giá trị là ĐỀ XUẤT BAN ĐẦU, kiểm chứng bằng Validation; không tuyên bố đã tối ưu.
# Lý do từng giá trị: docs/CNN_README.md.

model:
  name: cnn
  num_classes: 4            # theo configs/class_mapping.json
  pretrained: false         # bắt buộc: không tải pretrained weights
                            # kiến trúc (kênh, dropout 0.3) cố định trong src/models/cnn.py

data:
  class_mapping: configs/class_mapping.json
  train_split: data/splits/train.csv   # do NV1 cung cấp, không tự chia lại
  val_split: data/splits/val.csv
  test_split: data/splits/test.csv     # chỉ dùng để đánh giá cuối

preprocessing:              # Val/Test: tiền xử lý tất định
  image_size: 128
  normalize_mean: [0.5, 0.5, 0.5]   # tạm thời; thay bằng mean/std tính trên Train khi NV1 bàn giao
  normalize_std: [0.5, 0.5, 0.5]

augmentation:               # CHỈ áp dụng cho Train; transform do NV1 cung cấp (src/data/transforms.py)
  train: null               # chờ NV1 chốt danh sách phép biến đổi

training:
  seed: 42
  epochs: 40                # tối đa; early stopping có thể dừng sớm hơn
  batch_size: 32
  num_workers: 0
  loss: CrossEntropyLoss
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: null
  early_stopping_patience: 7

checkpoint:
  monitor: val_macro_f1     # chỉ số trên Validation, không dùng Test
  mode: max
  path: checkpoints/cnn_best.pt

output:
  results_dir: results/cnn
  figures_dir: figures
