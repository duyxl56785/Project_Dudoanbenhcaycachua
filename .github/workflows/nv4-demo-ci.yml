name: NV4 demo tests

on:
  pull_request:
    branches: [main]
    paths:
      - demo/**
      - src/inference.py
      - tests/test_inference.py
      - tests/test_demo_*.py
      - tests/test_nv4_*.py
      - docs/DEMO_README.md
      - .github/workflows/nv4-demo-ci.yml

permissions:
  contents: read

jobs:
  nv4-demo:
    if: github.head_ref == 'feature/nv4-demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest
      - name: Verify Python sources
        run: python -m compileall -q demo src tests
      - name: Run repository tests without dataset images or checkpoints
        run: python -m pytest tests -q
